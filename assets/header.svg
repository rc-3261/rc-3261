<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ritesh Chaudhari - Python and Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#1b1145"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="1000" dur="2.8s" begin="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>

  <!-- glowing orbs -->
  <circle cx="160" cy="90" r="90" fill="#00e5ff" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="160;300;160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;200;90" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="220" r="100" fill="#ff4081" opacity="0.30" filter="url(#blur)">
    <animate attributeName="cx" values="850;700;850" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="220;90;220" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="40" r="80" fill="#7c4dff" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="520;640;520" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- code brackets -->
  <text x="70" y="175" font-family="'Courier New', monospace" font-size="110" fill="#00e5ff" opacity="0.18">&lt;</text>
  <text x="850" y="175" font-family="'Courier New', monospace" font-size="110" fill="#ff4081" opacity="0.18">/&gt;</text>

  <!-- greeting -->
  <text x="500" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#9fb3d9" letter-spacing="6" opacity="0">
    HELLO WORLD, I'M
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- name -->
  <text x="500" y="170" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="url(#accent)" letter-spacing="2">
    RITESH CHAUDHARI
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </text>

  <!-- underline -->
  <rect x="380" y="190" width="240" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;240" dur="1.2s" begin="1s" fill="freeze"/>
    <animate attributeName="x" values="500;380" dur="1.2s" begin="1s" fill="freeze"/>
  </rect>

  <!-- typed tagline -->
  <g clip-path="url(#reveal)">
    <text x="500" y="240" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#e6edf7">
      Python  •  Django  •  React  •  Building things for the web
    </text>
  </g>
</svg>
