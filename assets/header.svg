<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ritesh Chaudhari - Software Developer" xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" fill-opacity="0.09"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
 
<rect width="1000" height="340" rx="22" fill="url(#bg)"/>
<rect width="1000" height="340" rx="22" fill="url(#dots)"/>
<circle cx="180" cy="60" r="110" fill="#22d3ee" opacity="0.22" filter="url(#blur)"><animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="820" cy="290" r="120" fill="#f472b6" opacity="0.22" filter="url(#blur)"><animate attributeName="cy" values="290;200;290" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="40" r="90" fill="#8b5cf6" opacity="0.25" filter="url(#blur)"/>
 
<!-- status pill -->
<rect x="60" y="62" width="262" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
<circle cx="82" cy="79" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="98" y="84" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">Open to collaboration</text>
 
<text x="60" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">Ritesh Chaudhari</text>
<text x="60" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="url(#acc)">Software Developer</text>
<text x="60" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">I build clean, scalable web applications with</text>
<text x="60" y="268" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">Python and modern JavaScript.</text>
<rect x="60" y="292" width="70" height="4" rx="2" fill="url(#acc)"/>
 
<!-- avatar -->
<g>
  <circle cx="820" cy="170" r="104" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="6 10" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 820 170" to="360 820 170" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="170" r="84" fill="#0b1226" stroke="url(#ring)" stroke-width="3"/>
  <text x="820" y="195" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="url(#acc)">RC</text>
  <g><animateTransform attributeName="transform" type="rotate" from="0 820 170" to="360 820 170" dur="14s" repeatCount="indefinite"/>
    <circle cx="820" cy="66" r="8" fill="#22d3ee"/></g>
  <g><animateTransform attributeName="transform" type="rotate" from="120 820 170" to="480 820 170" dur="14s" repeatCount="indefinite"/>
    <circle cx="820" cy="66" r="8" fill="#8b5cf6"/></g>
  <g><animateTransform attributeName="transform" type="rotate" from="240 820 170" to="600 820 170" dur="14s" repeatCount="indefinite"/>
    <circle cx="820" cy="66" r="8" fill="#f472b6"/></g>
</g>
 
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
 
