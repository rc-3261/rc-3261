<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Ritesh - Developer banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5a0"/>
      <stop offset="0.5" stop-color="#00d9f5"/>
      <stop offset="1" stop-color="#c471ed"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1000" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <!-- floating orbs -->
    <circle cx="120" cy="70" r="60" fill="#00f5a0" opacity="0.12"><animate attributeName="cy" values="70;110;70" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="230" r="80" fill="#c471ed" opacity="0.15"><animate attributeName="cy" values="230;190;230" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="60" r="35" fill="#00d9f5" opacity="0.15"><animate attributeName="cx" values="760;800;760" dur="5s" repeatCount="indefinite"/></circle>
    <!-- code symbols -->
    <text x="70" y="250" font-family="monospace" font-size="80" fill="#ffffff" opacity="0.07">&lt;/&gt;</text>
    <text x="800" y="140" font-family="monospace" font-size="90" fill="#ffffff" opacity="0.07">{ }</text>
    <!-- rotating ring -->
    <g transform="translate(870 80)">
      <circle r="38" fill="none" stroke="url(#txt)" stroke-width="3" stroke-dasharray="14 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#00f5a0" filter="url(#glow)"/>
    </g>
    <!-- text -->
    <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9fb3ff" letter-spacing="8">HELLO WORLD, I'M</text>
    <text x="500" y="185" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#txt)" filter="url(#glow)">RITESH</text>
    <text x="500" y="235" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="22" fill="#e6e6ff">Full Stack Developer  •  AI Enthusiast  •  Problem Solver</text>
    <!-- underline sweep -->
    <rect x="300" y="250" width="400" height="4" rx="2" fill="url(#txt)">
      <animate attributeName="width" values="0;400;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="500;300;500" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
